<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Smart Inventory Manager</title>
<meta name="description" content="AI-powered inventory management system">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{
surface:{900:'#0b1120',800:'#111827',700:'#1e293b',600:'#334155'},
accent:{400:'#22d3ee',500:'#06b6d4',600:'#0891b2'},
success:{400:'#4ade80',500:'#22c55e'},
warn:{400:'#fbbf24',500:'#f59e0b'},
danger:{400:'#f87171',500:'#ef4444'}
}}}}
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-surface-900 text-gray-100 font-sans min-h-screen pb-20">

<!-- Toast -->
<div id="toast" class="fixed top-4 right-4 z-50 hidden transform transition-all duration-300 translate-x-full">
  <div id="toast-inner" class="px-4 py-3 rounded-xl shadow-2xl backdrop-blur-xl border border-white/10 flex items-center gap-3">
    <span id="toast-msg" class="text-sm font-medium"></span>
  </div>
</div>

<!-- Alert Banner -->
<div id="alert-banner" class="hidden bg-gradient-to-r from-danger-500/20 to-warn-500/20 border-b border-danger-500/30 px-4 py-2.5">
  <div class="max-w-5xl mx-auto flex items-center gap-2 text-sm">
    <span class="animate-pulse text-danger-400">⚠</span>
    <span id="alert-text" class="text-danger-400 font-medium"></span>
  </div>
</div>

<!-- Header -->
<header class="sticky top-0 z-40 bg-surface-900/80 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="text-lg font-bold bg-gradient-to-r from-accent-400 to-accent-500 bg-clip-text text-transparent">📦 InvenAI</h1>
    <button onclick="manualStockCheck()" class="text-xs bg-white/5 hover:bg-white/10 px-3 py-1.5 rounded-lg border border-white/10 transition">🔄 Check Stock</button>
  </div>
</header>

<!-- Search Bar -->
<div id="search-section" class="max-w-5xl mx-auto px-4 py-3">
  <div class="flex gap-2">
    <input id="search-input" type="text" placeholder="Search items..." oninput="debounceSearch()" class="flex-1 bg-surface-700 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/50 placeholder-gray-500">
    <select id="filter-cat" onchange="loadItems()" class="bg-surface-700 border border-white/10 rounded-xl px-3 py-2.5 text-sm focus:outline-none">
      <option value="">All</option>
    </select>
    <select id="filter-status" onchange="loadItems()" class="bg-surface-700 border border-white/10 rounded-xl px-3 py-2.5 text-sm focus:outline-none">
      <option value="">Status</option>
      <option value="ok">✅ In Stock</option>
      <option value="low">⚠️ Low</option>
      <option value="out">🔴 Out</option>
    </select>
  </div>
</div>

<!-- Views -->
<main class="max-w-5xl mx-auto px-4">

  <!-- Dashboard View -->
  <div id="view-dash" class="view">
    <div id="stats-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>
    <h2 class="text-lg font-semibold mb-3">📊 AI Insights</h2>
    <div id="insights-list" class="space-y-3 mb-6"></div>
    <h2 class="text-lg font-semibold mb-3">🕐 Recent Activity</h2>
    <div id="recent-activity" class="space-y-2"></div>
  </div>

  <!-- Inventory View -->
  <div id="view-inv" class="view hidden">
    <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    <div id="empty-state" class="hidden text-center py-16 text-gray-500">
      <p class="text-4xl mb-3">📦</p>
      <p class="font-medium">No items found</p>
      <p class="text-sm mt-1">Add your first inventory item</p>
    </div>
  </div>

  <!-- Item Form View -->
  <div id="view-form" class="view hidden">
    <h2 id="form-title" class="text-xl font-bold mb-4">Add New Item</h2>
    <form id="item-form" onsubmit="saveItem(event)" class="space-y-4">
      <input type="hidden" id="f-id">
      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Name *</label>
        <input id="f-name" required class="w-full bg-surface-700 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/50">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1">Category</label>
          <select id="f-cat" class="w-full bg-surface-700 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1">Unit</label>
          <input id="f-unit" value="pcs" class="w-full bg-surface-700 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/50">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1">Quantity</label>
          <input id="f-qty" type="number" min="0" value="0" class="w-full bg-surface-700 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/50">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1">Low Stock Threshold</label>
          <input id="f-thresh" type="number" min="0" value="5" class="w-full bg-surface-700 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/50">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">SKU</label>
        <input id="f-sku" class="w-full bg-surface-700 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/50">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Description</label>
        <textarea id="f-desc" rows="2" class="w-full bg-surface-700 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/50"></textarea>
      </div>
      <label class="flex items-center gap-2 text-sm text-gray-400"><input type="checkbox" id="f-qr" checked class="accent-accent-500"> Auto-generate QR Code</label>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 bg-gradient-to-r from-accent-500 to-accent-600 text-white font-semibold py-3 rounded-xl hover:shadow-lg hover:shadow-accent-500/25 transition-all">Save Item</button>
        <button type="button" onclick="navigate('inv')" class="px-6 py-3 bg-surface-700 rounded-xl border border-white/10 hover:bg-surface-600 transition">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Detail View -->
  <div id="view-detail" class="view hidden">
    <div id="detail-content"></div>
  </div>

  <!-- Scanner View -->
  <div id="view-scan" class="view hidden">
    <h2 class="text-xl font-bold mb-4">📷 QR Scanner</h2>
    <div id="scanner-container" class="rounded-2xl overflow-hidden bg-surface-800 border border-white/10 mb-4"></div>
    <div id="scan-result" class="hidden bg-surface-800 rounded-xl p-4 border border-white/10"></div>
    <p class="text-center text-sm text-gray-500 mt-3">Point camera at an inventory QR code</p>
  </div>

  <!-- Analytics View -->
  <div id="view-analytics" class="view hidden">
    <h2 class="text-xl font-bold mb-4">🧠 AI Analytics</h2>
    <div id="analytics-content" class="space-y-4"></div>
    <canvas id="forecast-chart" class="mt-6 bg-surface-800 rounded-xl p-4 border border-white/10 hidden"></canvas>
  </div>
</main>

<!-- Bottom Nav -->
<nav class="fixed bottom-0 inset-x-0 z-50 bg-surface-800/90 backdrop-blur-xl border-t border-white/10">
  <div class="max-w-5xl mx-auto flex justify-around py-2">
    <button onclick="navigate('dash')" class="nav-btn active" data-view="dash"><span class="text-xl">🏠</span><span class="text-[10px]">Home</span></button>
    <button onclick="navigate('inv')" class="nav-btn" data-view="inv"><span class="text-xl">📦</span><span class="text-[10px]">Items</span></button>
    <button onclick="navigate('form');resetForm()" class="nav-btn" data-view="form"><span class="bg-gradient-to-r from-accent-500 to-accent-600 text-white w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-lg shadow-accent-500/30 -mt-4">+</span><span class="text-[10px]">Add</span></button>
    <button onclick="navigate('scan')" class="nav-btn" data-view="scan"><span class="text-xl">📷</span><span class="text-[10px]">Scan</span></button>
    <button onclick="navigate('analytics')" class="nav-btn" data-view="analytics"><span class="text-xl">📊</span><span class="text-[10px]">AI</span></button>
  </div>
</nav>

<!-- Modal -->
<div id="modal-overlay" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center" onclick="closeModal()">
  <div id="modal-content" class="bg-surface-800 rounded-t-2xl sm:rounded-2xl w-full sm:max-w-md p-6 border border-white/10 transform transition-all" onclick="event.stopPropagation()"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
